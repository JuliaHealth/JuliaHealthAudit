name: JuliaHealth Ecosystem Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  audit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-health-audit

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Create .env file
        run: echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env

      - name: Run audit pipeline
        run: julia --project=. scripts/main.jl

      - name: Verify audit outputs
        run: |
          set -e
      
          if [ ! -f data/results/audit_packages.csv ]; then
            echo "Missing audit_packages.csv — aborting"
            exit 1
          fi
      
          if [ ! -f data/results/audit_non_packages.csv ]; then
            echo "Missing audit_non_packages.csv — aborting"
            exit 1
          fi
      
          if [ ! -f data/results/audit_contributors.csv ]; then
            echo "Missing audit_contributors.csv — aborting"
            exit 1
          fi
      
          if [ ! -d data/visualizations ]; then
            echo "Missing visualizations directory — aborting"
            exit 1
          fi
      
          if [ ! -d data/history ]; then
            echo "Missing history directory — aborting"
            exit 1
          fi
      - name: Stage audit results
        run: |
          git add data/results/audit_packages.csv
          git add data/results/audit_non_packages.csv
          git add data/results/audit_contributors.csv
          git add -A data/visualizations
          git add -A data/history

      - name: Detect changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit audit results
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "update audit results"
          git push

      - name: Notify website repo
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -e
          curl -sS -f -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/JuliaHealth/juliahealth.github.io/dispatches \
            -d '{
                  "event_type": "audit-data-updated",
                  "client_payload": {
                    "target_branch": "main"
                  }
                }'
