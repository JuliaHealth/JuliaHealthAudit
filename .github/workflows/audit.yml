name: JuliaHealth Ecosystem Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: "1.11"

      - name: Cache Julia packages
        uses: actions/cache@v3
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ hashFiles('**/Project.toml') }}

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Create .env file
        run: echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" > .env

      - name: Run audit pipeline
        run: julia --project=. scripts/main.jl

      - name: Commit and push results
        run: |
          # Configure git identity
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage audit output files
          git add data/results/*.csv
          git add data/visualizations/*.png

          # Commit and push only if there are changes
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "update audit results"
            git push
          fi
